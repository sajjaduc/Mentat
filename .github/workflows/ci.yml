# Continuous integration
#
# Mentat targets a local, single-node deployment, but the same gates run in CI so a
# contribution cannot land with failing tests, a broken typecheck or an
# unreviewable migration. There is no cloud infrastructure to provision: the jobs
# use the repository's own SQLite database and a mock model server.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A deterministic key keeps secret tests reproducible; CI never handles real ones.
  MENTAT_MASTER_KEY: ${{ secrets.MENTAT_MASTER_KEY || 'Y2ktbWFzdGVyLWtleS1mb3ItbWVudGF0LWNpLTAwMDAwMDAwMA==' }}
  MENTAT_DB_PATH: ./data/mentat.db
  MENTAT_LOG_LEVEL: warn

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: SvelteKit sync
        run: bunx svelte-kit sync

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Svelte check
        run: bun run check

      - name: Unit and integration tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Migrations apply to a clean database
        run: |
          rm -rf ./data
          bun run db:migrate

      - name: Seed is idempotent
        run: |
          bun run seed
          bun run seed

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: bun run test:e2e
        env:
          # Playwright starts its own server and database under .e2e/.
          CI: 'true'

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
